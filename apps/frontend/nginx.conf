server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file resolves to index.html so
    # client-side routing (if added later) and hard refreshes both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE connections proxied through this nginx would otherwise get buffered/held —
    # not on the request path in this app (the frontend calls the backend directly on
    # its own published port, not through this nginx), but harmless to set and documents
    # the gotcha for anyone who later puts this frontend behind a reverse proxy to the API.
    add_header X-Accel-Buffering "no" always;
}
